version: 2
updates:
  # Keep the dependency tree and the lockfile current — the project ships a
  # committed lockfile and CI runs `npm ci`, so drift is safe to review here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-tooling:
        patterns:
          - eslint
          - globals
          - acorn
          - jsdom
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
