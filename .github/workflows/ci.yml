name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = oldest supported (engines floor), 24 = current LTS (what the
        # Docker image runs), 26 = current, which is what most contributors
        # are on locally. Node 20 shipped EOL in April 2026 and the pinned
        # better-sqlite3 has no Node 20 (ABI 115) prebuild any more.
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify dashboard data-args attributes
        run: node scripts/verify-data-args.mjs

  build:
    name: Build React dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles web/ with Vite. A broken JSX file or a bad import graph fails
      # here instead of in production, where the bot would serve a stale build.
      - name: Build dashboard
        run: npm run build:web
